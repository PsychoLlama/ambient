<!doctype html>
<!-- The program of this package, in a page. See `README.md` for how to build and serve it. -->
<meta charset="utf-8" />
<title>Ambient in a page</title>
<pre id="said"></pre>
<script type="module">
  import { load } from "../../crates/ambient-js/host.js";

  // The package's ID, as its manifest says it.
  const PACKAGE = "dc397fcddc58e66b5137bae3178633f0";
  const said = document.getElementById("said");
  const page = {
    "main.said": (line) => void said.append(`${line}\n`),
    "main.slept": (ms) => new Promise((wake) => setTimeout(wake, ms, null)),
  };

  const program = await load(fetch("page.wasm"), { [PACKAGE]: page });
  said.append(`gave ${await program.run()}\n`);
</script>
