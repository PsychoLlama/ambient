<!doctype html>
<!-- The program of this package, in a page. See `README.md` for how to build and serve it. -->
<meta charset="utf-8" />
<title>Ambient in a page</title>
<pre id="said"></pre>
<script type="module">
  // What the build wrote: the module, its host, and the JavaScript of
  // each extern the program reaches (`js/main.js`).
  import { start } from "./build/program.js";

  const program = await start();
  document.getElementById("said").append(`gave ${await program.run()}\n`);
</script>
