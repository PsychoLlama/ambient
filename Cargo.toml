[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
ambient-runtime = { path = "crates/ambient-runtime" }
cranelift-codegen = "0.136"
cranelift-frontend = "0.136"
cranelift-native = "0.136"
memmap2 = "0.9"
wasm-encoder = "0.263"
wasmtime = { version = "49", default-features = false, features = ["cranelift", "runtime", "std"] }
blake3 = "1.8"
postcard = { version = "1.1", default-features = false, features = ["use-std"] }
serde = { version = "1.0", features = ["derive", "rc"] }

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
style = { level = "deny", priority = -1 }
complexity = { level = "deny", priority = -1 }
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
self_named_module_files = "deny"
# Allowed in tests; see clippy.toml.
expect_used = "deny"
unwrap_used = "deny"
print_stdout = "warn"
print_stderr = "warn"
