[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
ambient-host = { path = "crates/ambient-host" }
ambient-runtime = { path = "crates/ambient-runtime" }
cranelift-codegen = "0.136"
cranelift-frontend = "0.136"
cranelift-native = "0.136"
memmap2 = "0.9"
wasm-encoder = "0.263"
wasmparser = { version = "0.263", default-features = false, features = ["std"] }
wasmtime = { version = "49", default-features = false, features = ["cranelift", "runtime", "std"] }
blake3 = "1.8"
getrandom = "0.4"
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
subtle = "2.6"
clap = { version = "4.6", features = ["derive"] }
proptest = "1.12"
postcard = { version = "1.1", default-features = false, features = ["use-std"] }
serde = { version = "1.0", features = ["derive", "rc"] }
stacker = "0.1"
toml = "1.1"
tiny_http = "0.12"
ureq = "3"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
style = { level = "deny", priority = -1 }
complexity = { level = "deny", priority = -1 }
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
self_named_module_files = "deny"
# Allowed in tests; see clippy.toml.
expect_used = "deny"
unwrap_used = "deny"
print_stdout = "warn"
print_stderr = "warn"

# The compilers a test run spends its time in are dependencies. Built
# without optimization they are most of that time.
[profile.dev.package."*"]
opt-level = 2
